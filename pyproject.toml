[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nexus-os"
version = "0.1.0"
description = "Nexus OS — AI-hardened security distribution tooling (Cerberus, nexus-recon)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "pyyaml",
    "onnxruntime; sys_platform != 'win32'",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[project.scripts]
cerberus = "cerberus.cerberus:main"
nexus-recon = "cli.nexus_recon:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
