name: Build RustScan (self-hosted)

on:
  push:
    paths:
      - 'packaging/aur/rustscan/**'
  workflow_dispatch: {}

jobs:
  build:
    name: Build RustScan on self-hosted runner
    runs-on: [self-hosted, linux, x64]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure Docker is available
        run: |
          if ! command -v docker >/dev/null 2>&1; then
            echo "Docker is required on the self-hosted runner to run the Arch build container." >&2
            exit 1
          fi

      - name: Build packages inside Arch Linux container
        env:
          PKGROOT: packaging/aur
        run: |
          docker run --rm -v "${{ github.workspace }}:/workspace" -w /workspace -e PKGROOT=/workspace/packaging/aur archlinux:latest /bin/bash -lc '
            set -e
            pacman -Sy --noconfirm --needed base-devel git curl unzip --noprogressbar || true
            for pkgdir in $PKGROOT/*; do
              if [ -f "$pkgdir/PKGBUILD" ]; then
                echo "Building $pkgdir"
                cd "$pkgdir"

                # Copy common local artifacts to expected filenames (rustscan use-case)
                for f in *-linux-amd64 *-amd64.tar.gz *.zip 2>/dev/null; do
                  [ -f "$f" ] || continue
                  case "$f" in
                    *rustscan*|*-linux-amd64) cp "$f" rustscan 2>/dev/null || true ;;
                    *) echo "Found artifact $f; leaving as-is" ;;
                  esac
                done
                chmod +x rustscan 2>/dev/null || true

                # Build package (ignore failures so one package doesn't break the whole run)
                makepkg -f --noconfirm --syncdeps --noprogressbar || true
                cd /workspace
              fi
            done
            ls -R $PKGROOT || true
          '

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: aur-packages
          path: |
            packaging/aur/*/*.pkg.tar.*

      - name: Show built files
        run: ls -lah packaging/aur || true
