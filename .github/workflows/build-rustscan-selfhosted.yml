name: Build RustScan (self-hosted)

on:
  push:
    paths:
      - 'packaging/aur/**'
  workflow_dispatch: {}

jobs:
  build:
    name: Build RustScan on self-hosted runner
    runs-on: [self-hosted, linux, x64]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure Docker is available
        run: |
          if ! command -v docker >/dev/null 2>&1; then
            echo "Docker is required on the self-hosted runner to run the Arch build container." >&2
            exit 1
          fi

      - name: Build packages inside Arch Linux container
        env:
          PKGROOT: packaging/aur
        run: |
          docker run --rm -v "${{ github.workspace }}:/workspace" -w /workspace -e PKGROOT=/workspace/packaging/aur archlinux:latest /bin/bash -lc '
            set -e
            pacman -Sy --noconfirm --needed base-devel git curl unzip --noprogressbar || true
            for pkgdir in $PKGROOT/*; do
              if [ -f "$pkgdir/PKGBUILD" ]; then
                echo "Building $pkgdir"
                cd "$pkgdir"

                # Copy common local artifacts to expected filenames (rustscan use-case)
                for f in *-linux-amd64 *-amd64.tar.gz *.zip 2>/dev/null; do
                  [ -f "$f" ] || continue
                  case "$f" in
                    *rustscan*|*-linux-amd64) cp "$f" rustscan 2>/dev/null || true ;;
                    *) echo "Found artifact $f; leaving as-is" ;;
                  esac
                done
                chmod +x rustscan 2>/dev/null || true

                # Build package (ignore failures so one package doesn't break the whole run)
                makepkg -f --noconfirm --syncdeps --noprogressbar || true
                cd /workspace
              fi
            done
            ls -R $PKGROOT || true
          '

      - name: Smoke tests for built packages (package-specific checks)
        run: |
          set -e
          echo "Running package-specific smoke-tests on packaged artifacts"
          # helper to run a command if binary exists
          try_run() {
            local exe="$1"; shift
            if [ -x "$exe" ]; then
              echo "Running: $exe $*"
              ("$exe" "$@") >/dev/null 2>&1 && echo "OK: $exe" || echo "WARN: $exe returned non-zero"
            else
              echo "Not present or not executable: $exe"
            fi
          }

          for pkgdir in packaging/aur/*; do
            pkgfile=$(ls -1 "$pkgdir"/*.pkg.tar.* 2>/dev/null | head -n1 || true)
            if [ -z "$pkgfile" ]; then
              echo "No built package for $pkgdir"
              continue
            fi
            echo "\n=== Testing $pkgfile ==="
            tmp=$(mktemp -d)
            bsdtar -xf "$pkgfile" -C "$tmp"

            # Specific checks per known packages
            if [ -x "$tmp/usr/bin/rustscan" ]; then
              try_run "$tmp/usr/bin/rustscan" --version
            fi
            if [ -x "$tmp/usr/bin/hashcat" ]; then
              try_run "$tmp/usr/bin/hashcat" --version
            fi
            if [ -x "$tmp/usr/bin/ophcrack" ]; then
              try_run "$tmp/usr/bin/ophcrack" --help
            fi
            # Ghidra: do not launch GUI; just check files exist under /opt
            if ls "$tmp/opt/ghidra-"* >/dev/null 2>&1; then
              echo "OK: Ghidra files present in /opt"
            elif [ -x "$tmp/usr/bin/ghidra" ]; then
              echo "OK: Ghidra wrapper present"
            fi

            # Generic fallback: find executables and try --version or run
            find "$tmp" -type f -perm /111 | while read -r exe; do
              case "$(basename "$exe")" in
                rustscan|hashcat|ophcrack|ghidra) ;;
                *) 
                  ("$exe" --version) >/dev/null 2>&1 && echo "OK: $(basename "$exe") --version" || (
                    ("$exe") >/dev/null 2>&1 && echo "OK: $(basename "$exe") ran" || echo "WARN: $(basename "$exe") failed")
                  ;;
              esac
            done

            rm -rf "$tmp"
          done


      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: aur-packages
          path: |
            packaging/aur/*/*.pkg.tar.*

      - name: Show built files
        run: ls -lah packaging/aur || true
