name: Build AUR Packages (self-hosted)

on:
  push:
    paths:
      - 'packaging/aur/**'
  workflow_dispatch: {}

jobs:
  build:
    name: Build all AUR packages on self-hosted runner
    runs-on: [self-hosted, linux, x64]
    strategy:
      max-parallel: 4
      fail-fast: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare Docker cache directory
        run: |
          mkdir -p ~/.cache/docker/archlinux-build
          chmod 777 ~/.cache/docker/archlinux-build

      - name: Ensure Docker is available
        run: |
          if ! command -v docker >/dev/null 2>&1; then
            echo "Docker is required on the self-hosted runner to run the Arch build container." >&2
            exit 1
          fi

      - name: Pre-build Docker image cache (pull latest)
        run: |
          docker pull archlinux:latest || true
          docker image prune -f --filter "until=72h" || true

      - name: Build packages inside Arch Linux container
        env:
          PKGROOT: packaging/aur
          PACMAN_CACHE: ~/.cache/pacman/pkg
        run: |
          mkdir -p ~/.cache/pacman/pkg
          docker run --rm \
            -v "${{ github.workspace }}:/workspace" \
            -v ~/.cache/pacman/pkg:/var/cache/pacman/pkg \
            -w /workspace \
            -e PKGROOT=/workspace/packaging/aur \
            archlinux:latest /bin/bash -lc '
            set -e
            pacman -Sy --noconfirm --needed base-devel git curl unzip p7zip --noprogressbar || true
            for pkgdir in $PKGROOT/*; do
              if [ -f "$pkgdir/PKGBUILD" ]; then
                echo "Building $(basename $pkgdir)"
                cd "$pkgdir"

                # Copy local artifacts
                for f in *-linux-amd64 *-amd64.tar.gz *.zip 2>/dev/null; do
                  [ -f "$f" ] || continue
                  case "$f" in
                    *rustscan*|*-linux-amd64) cp "$f" rustscan 2>/dev/null || true ;;
                    *) ;;
                  esac
                done
                chmod +x rustscan 2>/dev/null || true

                # Build with timeout
                timeout 30m makepkg -f --noconfirm --syncdeps --noprogressbar || true
                cd /workspace
              fi
            done
          '

      - name: Cleanup old packages (keep last 3)
        run: |
          for dir in packaging/aur/*/; do
            cd "$dir" 2>/dev/null || continue
            ls -t *.pkg.tar.* 2>/dev/null | tail -n +4 | xargs rm -f 2>/dev/null || true
            cd - >/dev/null
          done

      - name: Smoke tests for built packages (package-specific checks)
        run: |
          set -e
          echo "Running package-specific smoke-tests on packaged artifacts"
          # helper to run a command if binary exists
          try_run() {
            local exe="$1"; shift
            if [ -x "$exe" ]; then
              echo "Running: $exe $*"
              ("$exe" "$@") >/dev/null 2>&1 && echo "✓ OK: $exe" || echo "⚠ WARN: $exe returned non-zero"
            else
              echo "✗ Not present or not executable: $exe"
            fi
          }

          for pkgdir in packaging/aur/*; do
            pkgfile=$(ls -1 "$pkgdir"/*.pkg.tar.* 2>/dev/null | head -n1 || true)
            if [ -z "$pkgfile" ]; then
              echo "No built package for $(basename $pkgdir)"
              continue
            fi
            echo ""
            echo "=== Testing $(basename $pkgdir) ==="
            tmp=$(mktemp -d)
            bsdtar -xf "$pkgfile" -C "$tmp"

            # Package-specific smoke tests
            case "$(basename $pkgdir)" in
              rustscan)
                try_run "$tmp/usr/bin/rustscan" --version
                ;;
              hashcat)
                try_run "$tmp/usr/bin/hashcat" --version
                [ -d "$tmp/opt/hashcat-"* ] && echo "✓ OK: Hashcat binary dir present"
                ;;
              ophcrack)
                try_run "$tmp/usr/bin/ophcrack" --help
                [ -d "$tmp/opt/ophcrack-"* ] && echo "✓ OK: Ophcrack binary dir present"
                ;;
              ghidra)
                [ -d "$tmp/opt/ghidra-"* ] && echo "✓ OK: Ghidra files in /opt"
                [ -x "$tmp/usr/bin/ghidra" ] && echo "✓ OK: Ghidra wrapper present"
                ;;
              openvas)
                if [ -f "$tmp/usr/share/doc/openvas-gvm/README.openvas-setup" ]; then
                  echo "✓ OK: OpenVAS docs present"
                fi
                ;;
              *)
                # Generic fallback: check for executables
                find "$tmp/usr/bin" -type f -perm /111 2>/dev/null | head -n 3 | while read -r exe; do
                  try_run "$exe" --version || true
                done
                ;;
            esac

            rm -rf "$tmp"
          done


      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: aur-packages
          path: |
            packaging/aur/*/*.pkg.tar.*

      - name: Show built files
        run: ls -lah packaging/aur || true
